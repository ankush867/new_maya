name: Build and Release Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment and Secrets
        run: |
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=dummy_key" > .env.example
          fi
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=dummy_key" > .env
          fi
          echo "ksp.use.ksp2=true" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          echo "org.gradle.configuration-cache=false" >> gradle.properties

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Verify and Prepare APK
        id: apk_info
        run: |
          mkdir -p app/build/outputs/apk/debug
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in app/build/outputs/apk/debug!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" app/build/outputs/apk/debug/maya-assistant-debug.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release and Publish APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('v1.0.{0}', github.run_number) }}
          name: ${{ format('Maya Assistant v1.0.{0}', github.run_number) }}
          body: |
            ### Maya Assistant Debug APK Release 🚀

            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Status:** Ready to install on Android phone!
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
